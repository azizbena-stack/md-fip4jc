<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#121212">
<link rel="manifest" href="manifest.json">
<title>Wavestats</title>
<style>
:root{--bg:#121212;--card:#1e1e1e;--card2:#2a2a2a;--line:#2e2e2e;--txt:#f4f4f4;--mut:#9b9b9b;--acc:#ff2d55;--grn:#1ed760;--blue:#4aa3ff}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--txt);font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;max-width:560px;margin:0 auto;padding-bottom:90px;-webkit-tap-highlight-color:transparent}
button,select{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
a{color:inherit;text-decoration:none}
.demo{background:#3a0d18;color:#ffb3c1;font-size:12px;text-align:center;padding:6px 12px}
header{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;position:sticky;top:0;background:rgba(18,18,18,.92);backdrop-filter:blur(12px);z-index:6;height:60px}
.logo{display:flex;align-items:center;gap:9px;font-weight:800;font-size:19px;letter-spacing:-.02em}
.logo i{width:28px;height:28px;border-radius:8px;background:linear-gradient(160deg,#111 55%,var(--acc) 56%);border:2px solid #fff}
.ic{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:var(--card);font-size:17px}
main{padding:0 16px}
h2{font-size:12px;color:var(--mut);text-transform:uppercase;letter-spacing:.08em;margin:24px 0 10px;display:flex;justify-content:space-between;align-items:center}
h2 a{color:var(--blue);text-transform:none;letter-spacing:0;font-size:13px}
.sub{color:var(--mut);font-size:12.5px}
.up{color:var(--grn);font-size:12.5px;font-weight:700;white-space:nowrap}
.down{color:var(--acc);font-size:12.5px;font-weight:700;white-space:nowrap}
.row{display:flex;align-items:center;gap:12px;background:var(--card);border-radius:16px;padding:12px;margin-bottom:8px;width:100%;text-align:left}
.grow{flex:1;min-width:0}
.ell{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.av{width:50px;height:50px;border-radius:50%;flex:none;display:grid;place-items:center;font-weight:800;font-size:17px;color:#fff}
.av.big{width:78px;height:78px;font-size:27px}
.ver{color:var(--blue)}
.card{background:var(--card);border-radius:16px;padding:14px;margin-bottom:8px}
.pills{display:flex;gap:8px;overflow-x:auto;padding:2px 0 10px;scrollbar-width:none}
.pills::-webkit-scrollbar,.tabs::-webkit-scrollbar{display:none}
.pill{display:flex;align-items:center;gap:7px;padding:6px 13px 6px 6px;border-radius:20px;background:var(--card2);white-space:nowrap;font-size:13px;font-weight:600;flex:none}
.pill.txt{padding:7px 14px}
.pill.on{background:#fff;color:#111}
.dot{width:22px;height:22px;border-radius:50%;flex:none;display:inline-grid;place-items:center;font-size:11px;font-weight:900;color:#111}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tile{background:var(--card);border-radius:14px;padding:12px 12px 10px}
.tile .n{font-size:12.5px;color:#d0d0d0}
.tile b{display:block;font-size:25px;margin-top:4px;color:var(--c,var(--grn));letter-spacing:-.02em}
.hero{display:flex;gap:14px;align-items:center;margin:6px 0 12px}
.hero h1{font-size:23px;line-height:1.15}
.actions{display:flex;gap:8px;margin-bottom:6px;overflow-x:auto;scrollbar-width:none}
.btn{background:var(--acc);color:#fff;border-radius:22px;padding:9px 16px;font-weight:700;font-size:14px;white-space:nowrap}
.btn.ghost{background:var(--card2)}
.btn.full{width:100%;padding:12px}
.tabs{position:sticky;top:60px;z-index:5;background:rgba(18,18,18,.96);backdrop-filter:blur(12px);display:flex;gap:4px;overflow-x:auto;margin:0 -16px;padding:4px 16px 0;border-bottom:1px solid var(--line);scrollbar-width:none}
.tabs a{padding:10px 10px 11px;font-size:14px;font-weight:600;color:var(--mut);white-space:nowrap;border-bottom:3px solid transparent}
.tabs a.on{color:#fff;border-color:var(--acc)}
.seg{display:flex;background:var(--card2);border-radius:10px;padding:3px;margin-bottom:10px}
.seg button{flex:1;padding:7px;border-radius:8px;font-size:13px;color:var(--mut);font-weight:600}
.seg button.on{background:#474747;color:#fff}
.chart{position:relative}
.chart svg{display:block;width:100%;touch-action:pan-y}
.tip{min-height:20px;font-size:12.5px;margin-bottom:4px;color:var(--mut)}
.tip b{color:#fff}
.axis{display:flex;justify-content:space-between;font-size:11px;color:var(--mut);margin-top:4px}
.bar{margin:11px 0}
.bar .l{display:flex;justify-content:space-between;gap:8px;font-size:14px}
.bar .tr{height:7px;border-radius:4px;background:var(--card2);margin-top:5px;overflow:hidden}
.bar .fl{display:block;height:100%;border-radius:4px;background:var(--c,var(--grn))}
.ev{display:flex;gap:12px;align-items:flex-start;background:var(--card);border-radius:16px;padding:12px;margin-bottom:8px}
.ev .e{width:42px;height:42px;border-radius:12px;background:var(--card2);display:grid;place-items:center;flex:none;font-size:19px}
em{color:var(--blue);font-style:normal;font-weight:600}
.day{font-size:11px;color:var(--mut);text-align:center;margin:16px 0 8px;text-transform:uppercase;letter-spacing:.08em}
.list .it{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line)}
.list .it:last-child{border:0}
.cover{width:46px;height:46px;border-radius:8px;flex:none}
.rank{width:22px;text-align:center;font-weight:800;color:var(--mut);flex:none}
.tag{font-size:11px;padding:2px 8px;border-radius:10px;background:var(--card2);color:#ccc;white-space:nowrap}
.ins{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.ins div{background:var(--card2);border-radius:12px;padding:10px}
.ins b{display:block;font-size:17px;margin-top:2px}
#map{position:relative;min-height:170px}
#map svg{width:100%;display:block}
#map path{stroke:#121212;stroke-width:.4;cursor:pointer;transition:fill-opacity .2s}
#map path.sel{stroke:#fff;stroke-width:1.2}
.legend{display:flex;align-items:center;gap:8px;font-size:11px;color:var(--mut);margin-top:6px}
.legend i{flex:1;height:6px;border-radius:3px}
input[type=search]{width:100%;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:13px 14px;color:var(--txt);font:inherit;margin:14px 0 6px}
select{background:var(--card2);border-radius:12px;padding:11px;width:100%;font-weight:600;appearance:none}
.vs{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center;margin-top:12px}
.cmp{margin:12px 0}
.cmp .h{display:flex;justify-content:space-between;font-size:13px;margin-bottom:4px}
.cmp .t{display:flex;height:8px;border-radius:4px;overflow:hidden;background:var(--card2)}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;justify-content:center;background:rgba(18,18,18,.96);backdrop-filter:blur(12px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);z-index:7}
nav div{display:flex;width:100%;max-width:560px}
nav a{flex:1;padding:9px 0 8px;font-size:11px;color:var(--mut);display:flex;flex-direction:column;align-items:center;gap:1px}
nav a span{font-size:21px;line-height:1.2}
nav a.on{color:#fff}
.sw{position:relative;width:48px;height:29px;flex:none}
.sw input{opacity:0;width:0;height:0}
.sw i{position:absolute;inset:0;background:#444;border-radius:15px;transition:.2s}
.sw i:before{content:"";position:absolute;width:23px;height:23px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.2s}
.sw input:checked+i{background:var(--grn)}
.sw input:checked+i:before{transform:translateX(19px)}
.toast{position:fixed;left:50%;top:10px;transform:translate(-50%,-150%);width:calc(100% - 24px);max-width:500px;background:rgba(242,242,242,.97);color:#111;border-radius:18px;padding:12px 14px;z-index:20;transition:.35s;box-shadow:0 8px 30px #0009}
.toast.show{transform:translate(-50%,0)}
.toast small{color:#666;font-size:11px}
.toast em{color:#0a64c8}
.modal{position:fixed;inset:0;background:#000d;display:none;align-items:center;justify-content:center;flex-direction:column;gap:14px;z-index:15;padding:16px}
.modal.show{display:flex}
.modal canvas{width:min(290px,72vw);border-radius:18px}
.back{font-size:15px;color:var(--mut);padding:6px 0}
.empty{color:var(--mut);text-align:center;padding:30px 10px}
</style>
</head>
<body>
<div class="demo">Démo · maquette non officielle · artistes et chiffres fictifs</div>
<header>
  <a class="ic" href="#profil" aria-label="Mon profil">👤</a>
  <a class="logo" href="#accueil"><i></i>Wavestats</a>
  <a class="ic" href="#recherche" aria-label="Rechercher">🔍</a>
</header>
<main id="app"></main>
<nav><div>
  <a data-t="accueil" href="#accueil"><span>🏠</span>Accueil</a>
  <a data-t="activite" href="#activite"><span>⚡</span>Activité</a>
  <a data-t="comparer" href="#comparer"><span>⚖️</span>Comparer</a>
  <a data-t="recherche" href="#recherche"><span>🔍</span>Recherche</a>
  <a data-t="profil" href="#profil"><span>🔔</span>Alertes</a>
</div></nav>
<div class="toast" id="toast"></div>
<div class="modal" id="modal" onclick="if(event.target===this)this.classList.remove('show')">
  <canvas id="cv" width="1080" height="1920"></canvas>
  <div style="display:flex;gap:10px">
    <button class="btn" id="shareBtn">Partager / Enregistrer</button>
    <button class="btn ghost" onclick="modal.classList.remove('show')">Fermer</button>
  </div>
</div>
<script>
// ---------- Données fictives (générées de façon identique à chaque ouverture) ----------
let seed = 11; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
const pick = arr => arr[Math.floor(rnd() * arr.length)];
const PLAT = [
  {id:'all',n:'Vue globale',l:'W',c:'#ff2d55'},
  {id:'spotify',n:'Spotify',l:'S',c:'#1ed760',f:1,m:[['Auditeurs mensuels','listeners'],['Followers','followers'],['Popularité','popularity'],['Streams (28 j)','streams'],['Playlists actuelles','playlists'],['Portée des playlists','reach']]},
  {id:'apple',n:'Apple Music',l:'♫',c:'#fa2d48',f:.45,m:[['Streams (28 j)','streams'],['Playlists éditoriales','playlists'],['Classements actifs','charts'],['Meilleure position','best']]},
  {id:'youtube',n:'YouTube',l:'▶',c:'#ff3b30',f:.8,m:[['Abonnés','followers'],['Vues (28 j)','streams'],['Vues totales','views'],['Vidéos','videos']]},
  {id:'tiktok',n:'TikTok',l:'♪',c:'#20d5c4',f:1.4,m:[['Vidéos créées avec le son','videos'],['Vues des vidéos','views'],['Followers','followers'],['Likes','likes']]},
  {id:'shazam',n:'Shazam',l:'◎',c:'#4aa3ff',f:.3,m:[['Shazams (28 j)','shazams'],['Shazams totaux','views'],['Classements actifs','charts'],['Meilleure position','best']]},
  {id:'deezer',n:'Deezer',l:'D',c:'#a238ff',f:.35,m:[['Fans','followers'],['Streams (28 j)','streams'],['Playlists','playlists'],['Portée des playlists','reach']]},
  {id:'amazon',n:'Amazon Music',l:'a',c:'#ff9900',f:.25,m:[['Followers','followers'],['Streams (28 j)','streams'],['Playlists','playlists'],['Classements actifs','charts']]},
  {id:'soundcloud',n:'SoundCloud',l:'☁',c:'#ff5500',f:.3,m:[['Followers','followers'],['Écoutes (28 j)','streams'],['Likes','likes'],['Reposts','playlists']]},
  {id:'beatport',n:'Beatport',l:'B',c:'#a8e00f',f:.05,m:[['Classements actifs','charts'],['Meilleure position','best'],['Titres classés','tracks'],['Ventes estimées','likes']]},
  {id:'tidal',n:'Tidal',l:'T',c:'#d8d8d8',f:.1,m:[['Streams (28 j)','streams'],['Playlists','playlists'],['Followers','followers'],['Portée des playlists','reach']]},
  {id:'audiomack',n:'Audiomack',l:'M',c:'#ffa200',f:.15,m:[['Followers','followers'],['Écoutes (28 j)','streams'],['Playlists','playlists'],['Likes','likes']]},
];
const SOCIAL = [{id:'instagram',n:'Instagram',l:'◉',c:'#e1306c'},{id:'tiktok',n:'TikTok',l:'♪',c:'#20d5c4'},{id:'youtube',n:'YouTube',l:'▶',c:'#ff3b30'},{id:'x',n:'X (Twitter)',l:'X',c:'#e8e8e8'},{id:'facebook',n:'Facebook',l:'f',c:'#1877f2'}];
const EXTRA = {radio:{n:'Radio',l:'R',c:'#ffd60a'},dj:{n:'Sets DJ',l:'DJ',c:'#4aa3ff'},live:{n:'Concerts',l:'♥',c:'#ff7ac6'}};
const COUNTRIES = [['France',250,'🇫🇷'],['États-Unis',840,'🇺🇸'],['Allemagne',276,'🇩🇪'],['Royaume-Uni',826,'🇬🇧'],['Brésil',76,'🇧🇷'],['Espagne',724,'🇪🇸'],['Italie',380,'🇮🇹'],['Mexique',484,'🇲🇽'],['Canada',124,'🇨🇦'],['Pays-Bas',528,'🇳🇱'],['Belgique',56,'🇧🇪'],['Suisse',756,'🇨🇭'],['Maroc',504,'🇲🇦'],['Algérie',12,'🇩🇿'],['Tunisie',788,'🇹🇳'],['Sénégal',686,'🇸🇳'],["Côte d'Ivoire",384,'🇨🇮'],['Nigeria',566,'🇳🇬'],['Japon',392,'🇯🇵'],['Australie',36,'🇦🇺'],['Argentine',32,'🇦🇷'],['Colombie',170,'🇨🇴'],['Pologne',616,'🇵🇱'],['Suède',752,'🇸🇪'],['Turquie',792,'🇹🇷'],['Portugal',620,'🇵🇹'],['Inde',356,'🇮🇳'],['Afrique du Sud',710,'🇿🇦']];
const CITIES = [['Paris',250],['Lyon',250],['Marseille',250],['Toulouse',250],['Londres',826],['Manchester',826],['Berlin',276],['Hambourg',276],['New York',840],['Los Angeles',840],['Chicago',840],['São Paulo',76],['Rio de Janeiro',76],['Madrid',724],['Barcelone',724],['Milan',380],['Rome',380],['Mexico',484],['Montréal',124],['Toronto',124],['Amsterdam',528],['Bruxelles',56],['Genève',756],['Casablanca',504],['Alger',12],['Tunis',788],['Dakar',686],['Abidjan',384],['Lagos',566],['Tokyo',392],['Sydney',36],['Buenos Aires',32],['Bogotá',170],['Varsovie',616],['Stockholm',752],['Istanbul',792],['Lisbonne',620],['Mumbai',356],['Johannesburg',710]];
const country = iso => COUNTRIES.find(c => c[1] === iso);
const ARTIST_DEF = [['Nova Lune',250,'Électro / House'],['Kaïros',250,'Rap FR'],['Mira Sol',724,'Pop'],['Les Échos',56,'Afro House'],['DJ Atlas',276,'Techno'],['Selena Vey',840,'R&B'],['Oko Bay',566,'Afrobeats'],['Vantage',528,'House'],['Lila Moreno',484,'Pop latine'],['Haze District',826,'Drum & Bass'],['Rayan K',504,'Rap'],['Ophélie',124,'Pop']];
const TITLES = ['Minuit','Lumière','Mirage','Satellite','Danse encore','Océan','Vertige','Comète','Sous la pluie','Nuit blanche','Électrique','Horizon','Fièvre','Paradis','Sans retour','Néon'];
const PL_NAMES = {Éditoriale:['Fresh Finds France','Hits du Moment','New Music Friday France','Électro Chill','Rap FR Nouveautés','Afro Hits','Dance Rising','Pop Up','Techno Bunker','Club Bangers','Summer Vibes','Ultimate Party'],Algorithmique:['Radar des Sorties','Discover Weekly','Daily Mix 2','Flow','Mix du jour','Station radio'],Utilisateur:['Soirée entre potes','Running 180 BPM','Sons du moment ✨','Apéro','Workout Motivation','Road Trip','Chill du dimanche']};
const STATIONS = ['Onde 101','Radio Nova Sud','Club FM','Urban Wave','Électro 24','Hit Radio Lyon','Soleil FM','Night Session Radio'];
const DJS = ['DJ Marlo','Sasha Kern','Nils Ombre','Kira Vale','Tom Rives','Aya Moon','Duo Polaris','Félix Arno'];
const EVENTS_N = ['Festival Horizon','Club Orbite','Warehouse Session','Plage Électro','Nuit Blanche Open Air','Rooftop Sunset'];
const VENUES = ['Salle Lumière','Docks 26','Arena Sud','Le Phare','Club Orbite','Festival Horizon','La Grande Halle','Théâtre de Verre'];

const trendOf = (base, g, len = 180) => Array.from({length:len}, (_, d) => Math.max(1, base * (1 + g * (d - len + 1) / len + Math.sin(d / 11 + rnd()) * .025 + (rnd() - .5) * .025)));
const deltaOf = t => (t[t.length - 1] - t[t.length - 29]) / t[t.length - 29] * 100;
const daysAgoDate = d => { const x = new Date(); x.setDate(x.getDate() - d); return x; };

const ARTISTS = ARTIST_DEF.map(([name, home, genre], id) => {
  const scale = 10 ** (4.4 + rnd() * 2.5), g = rnd() * .9 - .15, hue = Math.round(rnd() * 360);
  const p = {};
  PLAT.slice(1).forEach(pl => {
    const s = scale * pl.f * (.6 + rnd() * .8);
    p[pl.id] = {listeners:s*4, followers:s*.7, popularity:Math.round(35+rnd()*60), streams:s*11, playlists:Math.round(5+rnd()*400*pl.f), reach:s*25,
      charts:Math.round(rnd()*40*pl.f+1), shazams:s*.9, videos:Math.round(s*.08), views:s*40, likes:s*3, best:1+Math.floor(rnd()*80), tracks:Math.round(1+rnd()*12)};
    p[pl.id].trend = trendOf(p[pl.id][pl.m[0][1]], g + (rnd() - .5) * .3);
    p[pl.id].delta = deltaOf(p[pl.id].trend);
  });
  const listeners = p.spotify.listeners;
  const w = COUNTRIES.map(c => [c, (c[1] === home ? 6 : 0) + rnd() ** 3 * 2]);
  const sum = w.reduce((s, x) => s + x[1], 0);
  const countries = w.map(([c, v]) => ({n:c[0], iso:c[1], flag:c[2], v:listeners * v / sum, d:(rnd() - .3) * 25})).sort((a, b) => b.v - a.v);
  const cities = CITIES.map(([n, iso]) => { const c = countries.find(x => x.iso === iso); return {n, iso, flag:c ? c.flag : '', v:(c ? c.v : 0) * (.15 + rnd() * .5), d:(rnd() - .3) * 25}; }).sort((a, b) => b.v - a.v);
  const tracks = Array.from({length:8}, (_, k) => {
    const s = scale * (8 - k) * (1.2 + rnd() * 2);
    return {t:TITLES[(id * 3 + k) % TITLES.length], h:(hue + k * 37) % 360, rel:Math.floor(10 + k * 60 + rnd() * 50), streams:s, playlists:Math.round(rnd() * 300), shazams:s * .05, videos:Math.round(s * .01), charts:Math.round(rnd() * 15),
      isrc:`FR-W26-${26 - Math.floor(k / 2)}-${String(id * 10 + k + 101).padStart(5, '0')}`, trend:trendOf(s / 30, g + rnd() * .3)};
  });
  const playlists = Array.from({length:18}, () => {
    const type = pick(['Éditoriale','Éditoriale','Algorithmique','Utilisateur','Utilisateur']);
    return {name:pick(PL_NAMES[type]), type, pl:pick(['spotify','spotify','apple','deezer','amazon','youtube','tidal','soundcloud']), fol:10 ** (2.5 + rnd() * 4), pos:1 + Math.floor(rnd() * 80), ago:Math.floor(rnd() * 60), track:Math.floor(rnd() * 5)};
  }).sort((a, b) => b.fol - a.fol);
  const charts = Array.from({length:10}, () => {
    const c = rnd() < .5 ? country(home) : pick(countries.slice(0, 8));
    const [pl, name] = pick([['spotify',`Top 200 ${c[0] || c.n}`],['spotify',`Viral 50 ${c[0] || c.n}`],['apple',`Top 100 ${c[0] || c.n}`],['shazam',`Shazam Top 200 ${c[0] || c.n}`],['deezer',`Top ${c[0] || c.n}`],['youtube',`Top Clips ${c[0] || c.n}`],['beatport',`Top 100 ${genre}`],['amazon',`Meilleures ventes ${c[0] || c.n}`]]);
    const pos = 1 + Math.floor(rnd() * 150);
    return {name, pl, pos, peak:Math.max(1, pos - Math.floor(rnd() * 40)), weeks:1 + Math.floor(rnd() * 20), move:Math.round((rnd() - .4) * 30), track:Math.floor(rnd() * 4)};
  }).sort((a, b) => a.pos - b.pos);
  const radio = STATIONS.map(n => ({n, flag:pick(countries.slice(0, 5)).flag, plays:Math.round(rnd() * 200 * (scale / 1e5) + 3)})).sort((a, b) => b.plays - a.plays).slice(0, 6);
  const djs = Array.from({length:6}, (_, k) => ({dj:pick(DJS), ev:pick(EVENTS_N), ago:k * 4 + Math.floor(rnd() * 4), track:Math.floor(rnd() * 4)}));
  const socials = SOCIAL.map(s => { const f = scale * (.3 + rnd()); const t = trendOf(f, g + (rnd() - .5) * .2); return {...s, fol:f, eng:(1 + rnd() * 7).toFixed(1), trend:t, d:deltaOf(t)}; });
  const shows = Array.from({length:5}, (_, k) => { const c = pick(cities.slice(0, 10)); return {city:c.n, flag:c.flag, venue:pick(VENUES), date:daysAgoDate(-(8 + k * 12 + Math.floor(rnd() * 9)))}; });
  return {id, name, home, genre, hue, verified:rnd() > .3, label:pick(['Indépendant','Lune Records','Onde Music','Sunset Label','Atlas Rec.']), p, countries, cities, tracks, playlists, charts, radio, djs, socials, shows,
    score:Math.round(40 + rnd() * 58)};
});

// Fil d'activité construit à partir des données de chaque artiste
const EVENTS = [];
ARTISTS.forEach(a => {

function fmt(n){return new Intl.NumberFormat('fr-FR', {notation:'compact', maximumFractionDigits:1}).format(Math.round(n))}
const full = n => Math.round(n).toLocaleString('fr-FR');
function dateFr(d, opt = {day:'numeric', month:'long'}){return d.toLocaleDateString('fr-FR', opt)}
const ago = h => h < 1 ? "à l'instant" : h < 24 ? `il y a ${h} h` : `il y a ${Math.floor(h / 24)} j`;
const val = (k, v) => k === 'popularity' ? v + '/100' : k === 'best' ? 'n°' + v : fmt(v);
const av = (a, big) => `<div class="av${big ? ' big' : ''}" style="background:linear-gradient(135deg,hsl(${a.hue} 70% 55%),hsl(${(a.hue + 60) % 360} 70% 28%))">${a.name.replace('DJ ', '').split(' ').map(w => w[0]).join('').slice(0, 2)}</div>`;
const cover = (h, s = 46) => `<div class="cover" style="width:${s}px;height:${s}px;background:linear-gradient(135deg,hsl(${h} 80% 55%),hsl(${(h + 90) % 360} 70% 32%))"></div>`;
const dot = pl => `<span class="dot" style="background:${pl.c}">${pl.l}</span>`;

// Graphique en courbe avec lecture au doigt
let pendingCharts = [];
function chart(series, h = 150){
  const id = 'c' + pendingCharts.length + Date.now(), w = 340, all = series.flatMap(s => s.data), min = Math.min(...all), max = Math.max(...all), n = series[0].data.length;
  const x = i => i / (n - 1) * w, y = v => h - 8 - (v - min) / (max - min || 1) * (h - 26);
  pendingCharts.push({id, series, x, n});
  const paths = series.map(s => { const d = s.data.map((v, i) => (i ? 'L' : 'M') + x(i).toFixed(1) + ' ' + y(v).toFixed(1)).join('');
    return (series.length === 1 ? `<path d="${d}L${w} ${h}L0 ${h}Z" fill="${s.color}" opacity=".14"/>` : '') + `<path d="${d}" fill="none" stroke="${s.color}" stroke-width="2.5" stroke-linejoin="round"/>`; }).join('');
  const grid = [0, .5, 1].map(f => { const v = min + (max - min) * f; return `<line x1="0" x2="${w}" y1="${y(v)}" y2="${y(v)}" stroke="#ffffff14"/><text x="${w - 2}" y="${y(v) - 4}" fill="#8a8a8a" font-size="10" text-anchor="end">${fmt(v)}</text>`; }).join('');
  return `<div class="chart" id="${id}"><div class="tip">Glissez le doigt sur la courbe pour voir le détail</div><svg viewBox="0 0 ${w} ${h}">${grid}${paths}<line class="cur" y1="0" y2="${h}" stroke="#fff8" visibility="hidden"/></svg><div class="axis"><span>${dateFr(daysAgoDate(n - 1), {day:'numeric', month:'short'})}</span><span>Aujourd'hui</span></div></div>`;
}
function bindCharts(){
  pendingCharts.forEach(c => {
    const el = document.getElementById(c.id); if (!el) return;
    const svg = el.querySelector('svg'), line = el.querySelector('.cur'), tip = el.querySelector('.tip');
    const move = e => { const r = svg.getBoundingClientRect(), i = Math.max(0, Math.min(c.n - 1, Math.round((e.clientX - r.left) / r.width * (c.n - 1))));
      line.setAttribute('x1', c.x(i)); line.setAttribute('x2', c.x(i)); line.setAttribute('visibility', 'visible');
      tip.innerHTML = `<b>${dateFr(daysAgoDate(c.n - 1 - i), {weekday:'short', day:'numeric', month:'short'})}</b> · ` + c.series.map(s => `<span style="color:${s.color}">${s.name ? s.name + ' : ' : ''}${full(s.data[i])}</span>`).join(' · '); };
    svg.addEventListener('pointermove', move); svg.addEventListener('pointerdown', move);
  });
  pendingCharts = [];
}

// ---------- Carte du monde (chargée à la demande) ----------
let mapLib;
function loadMap(){
  return mapLib ||= Promise.all([
    import('https://cdn.jsdelivr.net/npm/d3-geo@3.1.1/+esm'),
    import('https://cdn.jsdelivr.net/npm/topojson-client@3.1.0/+esm'),
    fetch('https://cdn.jsdelivr.net/npm/world-atlas@2.0.2/countries-110m.json').then(r => r.json()),
  ]).then(([geo, topo, world]) => ({geo, feats:topo.feature(world, world.objects.countries).features.filter(f => f.id !== '010')}))
    .catch(e => { mapLib = null; throw e; });
}
async function drawMap(a){
  const box = document.getElementById('map'); if (!box) return;
  try {
    const {geo, feats} = await loadMap();
    const proj = geo.geoNaturalEarth1().fitSize([340, 175], {type:'Sphere'}), path = geo.geoPath(proj);
    const max = a.countries[0].v, color = '#1ed760';
    box.innerHTML = `<svg viewBox="0 0 340 175">${feats.map(f => { const c = a.countries.find(x => x.iso === +f.id), v = c ? c.v : 0;
      return `<path d="${path(f)}" data-iso="${+f.id}" fill="${v ? color : '#3a3a3a'}" fill-opacity="${v ? (.18 + .82 * Math.sqrt(v / max)).toFixed(2) : 1}"${+f.id === state.selIso ? ' class="sel"' : ''}/>`; }).join('')}</svg>
      <div class="legend">Peu<i style="background:linear-gradient(90deg,${color}33,${color})"></i>Beaucoup d'auditeurs</div>`;
    box.querySelector('svg').onclick = e => { const iso = +e.target.dataset.iso; if (!iso) return; state.selIso = iso;
      box.querySelectorAll('path.sel').forEach(p => p.classList.remove('sel')); e.target.classList.add('sel'); showCountry(a); };
  } catch { box.innerHTML = '<p class="sub" style="padding:20px 0;text-align:center">Carte indisponible hors connexion — la liste des pays ci-dessous reste à jour.</p>'; }
}
function showCountry(a){
  const el = document.getElementById('cinfo'), c = a.countries.find(x => x.iso === state.selIso), meta = country(state.selIso);
  if (!el) return;
  if (!c) { el.innerHTML = `<b>${meta ? meta[2] + ' ' + meta[0] : 'Ce pays'}</b><div class="sub">Pas encore d'auditeurs mesurés ici.</div>`; return; }
  const rank = a.countries.indexOf(c) + 1, share = c.v / a.countries.reduce((s, x) => s + x.v, 0) * 100;
  const cities = a.cities.filter(x => x.iso === c.iso && x.v > 0);
  el.innerHTML = `<div style="display:flex;justify-content:space-between;align-items:center"><b style="font-size:17px">${c.flag} ${c.n}</b><span class="tag">n°${rank} des pays</span></div>
    <div class="ins" style="margin-top:10px"><div><span class="sub">Auditeurs mensuels</span><b>${full(c.v)}</b></div><div><span class="sub">Part de l'audience</span><b>${share.toFixed(1).replace('.', ',')} %</b></div><div><span class="sub">Évolution (28 j)</span><b>${delta(c.d)}</b></div><div><span class="sub">Streams estimés (28 j)</span><b>${fmt(c.v * 2.8)}</b></div></div>
    ${cities.length ? `<div class="sub" style="margin-top:10px">Villes : ${cities.map(x => `<b style="color:#fff">${x.n}</b> ${fmt(x.v)}`).join(' · ')}</div>` : ''}`;
}

    return `<a href="#recherche"><input type="search" placeholder="🔍  Rechercher un artiste ou un titre" readonly></a>
      <h2>Mes artistes <a href="#recherche">+ Ajouter</a></h2>${mine.length ? mine.map(a => `<a class="row" href="#artiste/${a.id}">${av(a)}<div class="grow"><b>${a.name}</b>${ver(a)}<div class="sub">${fmt(a.p.spotify.listeners)} auditeurs mensuels · ${country(a.home)[2]} ${a.genre}</div></div>${delta(a.p.spotify.delta)}</a>`).join('') : '<p class="empty">Vous ne suivez aucun artiste. Touchez « + Ajouter ».</p>'}
      <h2>Plus fortes progressions (28 j)</h2><div class="pills">${movers.map(a => `<a class="card" href="#artiste/${a.id}" style="flex:none;width:150px;text-align:center;margin:0">${av(a).replace('class="av"', 'class="av" style="margin:0 auto 8px;background:linear-gradient(135deg,hsl(' + a.hue + ' 70% 55%),hsl(' + (a.hue + 60) % 360 + ' 70% 28%))"')}<b class="ell" style="display:block">${a.name}</b>${delta(a.p.spotify.delta)}</a>`).join('')}</div>
      <h2>Dernière activité <a href="#activite">Tout voir</a></h2>${EVENTS.filter(e => followed.includes(e.a.id)).slice(0, 4).map(evHtml).join('')}`;
  },
  activite(){
    const F = [['tout','Tout'],['playlist','Playlists'],['chart','Classements'],['palier','Paliers'],['tiktok','TikTok'],['radio','Radio'],['dj','DJ'],['concert','Concerts']];
    const ev = EVENTS.filter(e => followed.includes(e.a.id) && (state.feed === 'tout' || e.kind === state.feed));
    let out = '', last = '';
    ev.forEach(e => { const d = e.ago < 24 ? "Aujourd'hui" : e.ago < 48 ? 'Hier' : e.ago < 168 ? 'Cette semaine' : 'Plus ancien'; if (d !== last) { out += `<div class="day">${d}</div>`; last = d; } out += evHtml(e); });
    return `<h2>Activité de mes artistes</h2><div class="pills">${F.map(([k, n]) => `<button class="pill txt${k === state.feed ? ' on' : ''}" onclick="state.feed='${k}';render(1)">${n}</button>`).join('')}</div>${out || '<p class="empty">Rien pour le moment. Suivez des artistes pour voir leur activité.</p>'}`;
  },
  comparer(){
    const A = ARTISTS[state.cmpA], B = ARTISTS[state.cmpB], pl = PLAT.find(p => p.id === state.cmpPlat), ca = 'var(--acc)', cb = '#4aa3ff';
    const sel = (k, v) => `<select onchange="state.${k}=+this.value;render(1)">${ARTISTS.map(a => `<option value="${a.id}"${a.id === v ? ' selected' : ''}>${a.name}</option>`).join('')}</select>`;
    const rows = pl.m.map(([n, k]) => { const x = A.p[pl.id][k], y = B.p[pl.id][k], s = k === 'best' ? [1 / x, 1 / y] : [x, y]; return `<div class="cmp"><div class="h"><b style="color:${ca}">${val(k, x)}</b><span class="sub">${n}</span><b style="color:${cb}">${val(k, y)}</b></div><div class="t"><span style="width:${s[0] / (s[0] + s[1]) * 100}%;background:${ca}"></span><span style="flex:1;background:${cb}"></span></div></div>`; }).join('');
    return `<h2>Comparer deux artistes</h2><div class="vs">${sel('cmpA', state.cmpA)}<b class="sub">VS</b>${sel('cmpB', state.cmpB)}</div>
      <div class="pills" style="margin-top:12px">${PLAT.slice(1).map(p => `<button class="pill${p.id === state.cmpPlat ? ' on' : ''}" onclick="state.cmpPlat='${p.id}';render(1)">${dot(p)}${p.n}</button>`).join('')}</div>
      <div class="card">${rows}</div>
      <h2>Progression comparée (3 mois)</h2><div class="card"><p class="sub" style="margin-bottom:6px">${pl.m[0][0]} · base 100 il y a 3 mois</p>${chart([A, B].map((x, k) => { const t = x.p[pl.id].trend.slice(-90); return {data:t.map(v => v / t[0] * 100), color:k ? cb : '#ff2d55', name:x.name}; }))}</div>
      <h2>Pays n°1 à 5</h2><div class="card" style="display:grid;grid-template-columns:1fr 1fr;gap:12px;font-size:14px">${[A, B].map((x, k) => `<div><b style="color:${k ? cb : ca}">${x.name}</b>${x.countries.slice(0, 5).map(c => `<div style="padding:3px 0">${c.flag} ${c.n} <span class="sub">${fmt(c.v)}</span></div>`).join('')}</div>`).join('')}</div>`;
  },
  recherche(){
    return `<input type="search" id="q" placeholder="Nom d'artiste, titre ou genre…" oninput="renderSearch()" value="${state.q || ''}"><div id="res"></div>`;
  },
  profil(){
    const items = [['playlist','Ajouts en playlist','Dès qu\'un titre entre dans une playlist'],['chart','Classements','Entrées et progressions dans les tops'],['palier','Paliers franchis','10 k, 100 k, 1 M followers…'],['tiktok','Tendances TikTok','Un son qui décolle sur TikTok'],['radio','Diffusions radio','Chaque passage en radio'],['dj','Soutiens de DJ','Un DJ joue un titre en set'],['concert','Concerts','Nouvelles dates annoncées'],['weekly','Résumé de la semaine','Chaque lundi, vos chiffres clés']];
    return `<h2>Notifications</h2>${items.map(([k, n, d]) => `<label class="row"><div class="grow"><b>${n}</b><div class="sub">${d}</div></div><span class="sw"><input type="checkbox" ${prefs[k] ? 'checked' : ''} onchange="prefs.${k}=this.checked;store.set('prefs',prefs)"><i></i></span></label>`).join('')}
      <button class="btn full" style="margin-top:8px" onclick="testNotif()">🔔 Tester une notification</button>
      <h2>Mon compte</h2><div class="card"><b>Formule gratuite</b><div class="sub" style="margin:4px 0 12px">${followed.length} artiste(s) suivi(s)</div><button class="btn ghost" onclick="toast('Wavestats Pro','Le paiement n\\'est pas disponible dans cette démo.')">Découvrir Wavestats Pro</button></div>
      <h2>À propos</h2><div class="card sub">Démo non officielle inspirée de Songstats. Les artistes, chiffres, playlists, radios et concerts sont inventés. Vos artistes suivis et réglages restent sur cet appareil.</div>`;
  },
};

function artistView(id, t){
  const a = ARTISTS[id]; if (!a) return views.accueil();
  if (!tab[t]) t = 'apercu';
  const isF = followed.includes(id);
  return `<button class="back" onclick="history.length>1?history.back():location.hash='accueil'">‹ Retour</button>
    <div class="hero">${av(a, 1)}<div class="grow"><h1>${a.name}${ver(a)}</h1><div class="sub">${country(a.home)[2]} ${country(a.home)[0]} · ${a.genre}</div><div class="sub">Label : ${a.label}</div></div></div>
    <div class="actions"><button class="btn${isF ? ' ghost' : ''}" onclick="toggleFollow(${id})">${isF ? '✓ Suivi' : '+ Suivre'}</button><button class="btn ghost" onclick="openShare(${id})">📤 Story</button><button class="btn ghost" onclick="exportCSV(${id})">⬇️ Exporter</button><a class="btn ghost" href="#comparer" onclick="state.cmpA=${id};state.cmpB=${(id + 1) % ARTISTS.length}">⚖️ Comparer</a></div>
    <div class="tabs">${TABS.map(([k, n]) => `<a href="#artiste/${id}/${k}" class="${k === t ? 'on' : ''}">${n}</a>`).join('')}</div>
    ${tab[t](a)}`;
}
function trackView(aid, k){
  const a = ARTISTS[aid], t = a && a.tracks[k]; if (!t) return views.accueil();
  const pls = a.playlists.filter(x => x.track === k), chs = a.charts.filter(x => x.track === k);
  return `<button class="back" onclick="history.back()">‹ Retour</button>
    <div class="hero">${cover(t.h, 88)}<div class="grow"><h1>${t.t}</h1><a class="sub" href="#artiste/${a.id}">${a.name} ›</a><div class="sub">Sorti le ${dateFr(daysAgoDate(t.rel), {day:'numeric', month:'long', year:'numeric'})} · ISRC ${t.isrc}</div></div></div>
    <div class="tiles"><div class="tile"><div class="n">Streams totaux</div><b>${fmt(t.streams)}</b></div><div class="tile"><div class="n">Playlists</div><b>${t.playlists}</b></div><div class="tile" style="--c:#4aa3ff"><div class="n">Shazams</div><b>${fmt(t.shazams)}</b></div><div class="tile" style="--c:#20d5c4"><div class="n">Vidéos TikTok</div><b>${fmt(t.videos)}</b></div></div>
    <h2>Streams par jour (3 mois)</h2><div class="card">${chart([{data:t.trend.slice(-90), color:'#1ed760'}])}</div>
    <h2>Dans les playlists</h2><div class="card list">${pls.map(x => `<div class="it">${dot(PLAT.find(p => p.id === x.pl))}<div class="grow"><b>${x.name}</b><div class="sub">position ${x.pos} · ${x.type}</div></div><b>${fmt(x.fol)}</b></div>`).join('') || '<p class="empty">Pas encore en playlist suivie.</p>'}</div>
    <h2>Dans les classements</h2><div class="card list">${chs.map(x => `<div class="it">${dot(PLAT.find(p => p.id === x.pl))}<div class="grow"><b>${x.name}</b><div class="sub">meilleur : n°${x.peak} · ${x.weeks} sem.</div></div><b>n°${x.pos}</b></div>`).join('') || '<p class="empty">Pas de classement actif.</p>'}</div>`;
}

// ---------- Navigation (le bouton retour du téléphone fonctionne) ----------
function render(keepScroll){
  const [v, x, y] = (location.hash.slice(1) || 'accueil').split('/');
  const app = document.getElementById('app'), sy = scrollY;
  app.innerHTML = v === 'artiste' ? artistView(+x, y || 'apercu') : v === 'titre' ? trackView(+x, +y) : (views[v] || views.accueil)();
  document.querySelectorAll('nav a').forEach(b => b.classList.toggle('on', b.dataset.t === v || (v === '' && b.dataset.t === 'accueil')));
  if (keepScroll) scrollTo({top:sy, behavior:'instant'}); else scrollTo({top:0, behavior:'instant'});
  bindCharts();
  if (v === 'recherche') { renderSearch(); const q = document.getElementById('q'); q.focus(); }
  if (v === 'artiste' && y === 'audience') { drawMap(ARTISTS[+x]).then(() => state.selIso && showCountry(ARTISTS[+x])); }
}
addEventListener('hashchange', () => { state.selIso = null; render(0); });

function renderSearch(){
  const q = (state.q = document.getElementById('q').value).toLowerCase().trim();
  const arts = ARTISTS.filter(a => (a.name + ' ' + a.genre + ' ' + country(a.home)[0]).toLowerCase().includes(q));
  const trs = q ? ARTISTS.flatMap(a => a.tracks.map((t, k) => ({a, t, k}))).filter(x => x.t.t.toLowerCase().includes(q)) : [];
  document.getElementById('res').innerHTML = `<h2>Artistes</h2>` + (arts.map(a => `<div class="row"><a href="#artiste/${a.id}" style="display:flex;align-items:center;gap:12px;flex:1;min-width:0">${av(a)}<div class="grow"><b>${a.name}</b>${ver(a)}<div class="sub">${country(a.home)[2]} ${a.genre} · ${fmt(a.p.spotify.listeners)} auditeurs</div></div></a><button class="btn${followed.includes(a.id) ? ' ghost' : ''}" style="padding:7px 13px;font-size:13px" onclick="toggleFollow(${a.id},1)">${followed.includes(a.id) ? '✓ Suivi' : 'Suivre'}</button></div>`).join('') || '<p class="empty">Aucun artiste trouvé.</p>')
    + (trs.length ? `<h2>Titres</h2><div class="card list">${trs.map(x => `<a class="it" href="#titre/${x.a.id}/${x.k}">${cover(x.t.h)}<div class="grow"><b>${x.t.t}</b><div class="sub">${x.a.name}</div></div><span class="sub">${fmt(x.t.streams)}</span></a>`).join('')}</div>` : '');
}
function toggleFollow(id, inSearch){
  followed = followed.includes(id) ? followed.filter(x => x !== id) : [...followed, id];
  store.set('followed', followed);
  inSearch ? renderSearch() : render(1);
  toast(ARTISTS[id].name, followed.includes(id) ? 'Ajouté à vos artistes. Vous recevrez ses alertes.' : 'Retiré de vos artistes.');
}
function toast(title, body){
  const t = document.getElementById('toast');
  t.innerHTML = `<small>WAVESTATS · maintenant</small><div><b>${title}</b></div><div style="font-size:14px">${body}</div>`;
  t.classList.add('show'); clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove('show'), 4000);
}
function testNotif(){
  const e = EVENTS.find(e => followed.includes(e.a.id) && prefs[e.kind] !== false) || EVENTS[0];
  toast(e.a.name + ' · ' + e.pl.n, e.txt);
}
function exportCSV(id){
  const a = ARTISTS[id], rows = [['Rubrique', 'Statistique', 'Valeur']];
  PLAT.slice(1).forEach(pl => pl.m.forEach(([n, k]) => rows.push([pl.n, n, Math.round(a.p[pl.id][k])])));
  a.countries.forEach(c => rows.push(['Audience par pays', c.n, Math.round(c.v)]));
  a.cities.filter(c => c.v > 0).forEach(c => rows.push(['Audience par ville', c.n, Math.round(c.v)]));
  a.tracks.forEach(t => rows.push(['Titres', t.t, Math.round(t.streams)]));
  const csv = rows.map(r => r.map(x => `"${String(x).replace(/"/g, '""')}"`).join(';')).join('\n');
  const l = document.createElement('a'); l.href = URL.createObjectURL(new Blob(['﻿' + csv], {type:'text/csv'})); l.download = a.name.replace(/\W+/g, '-') + '-wavestats.csv'; l.click();
  toast('Export prêt', 'Le fichier tableur (CSV) est téléchargé.');
}

// Story partageable 1080×1920
function openShare(id){
  const a = ARTISTS[id], pl = PLAT.find(p => p.id === state.plat), s = pl.id === 'all' ? null : a.p[pl.id];
  const cv = document.getElementById('cv'), c = cv.getContext('2d');
  const g = c.createLinearGradient(0, 0, 1080, 1920);
  g.addColorStop(0, `hsl(${a.hue} 75% 45%)`); g.addColorStop(.55, `hsl(${(a.hue + 70) % 360} 70% 28%)`); g.addColorStop(1, '#111');
  c.fillStyle = g; c.fillRect(0, 0, 1080, 1920);
  c.fillStyle = '#fff'; c.textAlign = 'center';
  c.font = '800 64px -apple-system,sans-serif'; c.fillText('Wavestats', 540, 200);
  c.font = '800 118px -apple-system,sans-serif'; c.fillText(a.name, 540, 640);
  c.font = '500 48px -apple-system,sans-serif'; c.fillStyle = '#ffffffcc'; c.fillText(pl.n, 540, 730);
  const stats = s ? pl.m.slice(0, 2).map(([n, k]) => [n, val(k, s[k])]) : [['Followers', fmt(sumP(a, 'followers'))], ['Streams (28 j)', fmt(sumP(a, 'streams'))]];
  stats.push(['Pays n°1', a.countries[0].n]);
  stats.forEach(([n, v], k) => { c.fillStyle = '#ffffff22'; c.beginPath(); c.roundRect(140, 840 + k * 290, 800, 240, 40); c.fill();
    c.fillStyle = '#fff'; c.font = '800 100px -apple-system,sans-serif'; c.fillText(v, 540, 960 + k * 290);
    c.font = '500 42px -apple-system,sans-serif'; c.fillStyle = '#ffffffcc'; c.fillText(n, 540, 1030 + k * 290); });
  c.font = '500 34px -apple-system,sans-serif'; c.fillStyle = '#ffffff88'; c.fillText('Données fictives · démo', 540, 1840);
  document.getElementById('modal').classList.add('show');
  document.getElementById('shareBtn').onclick = () => cv.toBlob(async b => {
    const f = new File([b], 'wavestats-story.png', {type:'image/png'});
    if (navigator.canShare?.({files:[f]})) { try { await navigator.share({files:[f]}); } catch {} }
    else { const l = document.createElement('a'); l.href = URL.createObjectURL(b); l.download = f.name; l.click(); }
  });
}

render(0);
setTimeout(testNotif, 2500);
</script>
</body>
</html>
