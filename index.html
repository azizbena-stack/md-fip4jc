<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#121212">
<link rel="manifest" href="manifest.json">
<title>Wavestats</title>
<style>
:root{--bg:#121212;--card:#1e1e1e;--card2:#2a2a2a;--line:#2e2e2e;--txt:#f4f4f4;--mut:#9b9b9b;--acc:#ff2d55;--grn:#1ed760;--blue:#4aa3ff;--dz:#a238ff}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--txt);font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;max-width:560px;margin:0 auto;padding-bottom:90px;-webkit-tap-highlight-color:transparent}
button,select{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
a{color:inherit;text-decoration:none}
img{display:block}
.demo{background:#3a0d18;color:#ffb3c1;font-size:12px;text-align:center;padding:6px 12px}
header{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;position:sticky;top:0;background:rgba(18,18,18,.92);backdrop-filter:blur(12px);z-index:6;height:60px}
.logo{display:flex;align-items:center;gap:9px;font-weight:800;font-size:19px;letter-spacing:-.02em}
.logo i{width:28px;height:28px;border-radius:8px;background:linear-gradient(160deg,#111 55%,var(--acc) 56%);border:2px solid #fff}
.ic{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:var(--card);font-size:17px}
main{padding:0 16px}
h2{font-size:12px;color:var(--mut);text-transform:uppercase;letter-spacing:.08em;margin:24px 0 10px;display:flex;justify-content:space-between;align-items:center;gap:8px}
h2 a{color:var(--blue);text-transform:none;letter-spacing:0;font-size:13px}
.badge{font-size:10.5px;letter-spacing:0;text-transform:none;padding:2px 8px;border-radius:10px;font-weight:700;white-space:nowrap}
.badge.real{background:#a238ff33;color:#d3a6ff}
.badge.sim{background:#ffd60a22;color:#ffd60a}
.sub{color:var(--mut);font-size:12.5px}
.up{color:var(--grn);font-size:12.5px;font-weight:700;white-space:nowrap}
.down{color:var(--acc);font-size:12.5px;font-weight:700;white-space:nowrap}
.row{display:flex;align-items:center;gap:12px;background:var(--card);border-radius:16px;padding:12px;margin-bottom:8px;width:100%;text-align:left}
.grow{flex:1;min-width:0}
.ell{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.av{width:52px;height:52px;border-radius:50%;flex:none;object-fit:cover;background:var(--card2)}
.av.big{width:84px;height:84px}
.card{background:var(--card);border-radius:16px;padding:14px;margin-bottom:8px}
.pills{display:flex;gap:8px;overflow-x:auto;padding:2px 0 10px;scrollbar-width:none}
.pills::-webkit-scrollbar,.tabs::-webkit-scrollbar,.actions::-webkit-scrollbar{display:none}
.pill{display:flex;align-items:center;gap:7px;padding:6px 13px 6px 6px;border-radius:20px;background:var(--card2);white-space:nowrap;font-size:13px;font-weight:600;flex:none}
.pill.txt{padding:7px 14px}
.pill.on{background:#fff;color:#111}
.dot{width:22px;height:22px;border-radius:50%;flex:none;display:inline-grid;place-items:center;font-size:11px;font-weight:900;color:#111}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tile{background:var(--card);border-radius:14px;padding:12px 12px 10px;min-width:0}
.tile .n{font-size:12.5px;color:#d0d0d0}
.tile b{display:block;font-size:24px;margin-top:4px;color:var(--c,var(--grn));letter-spacing:-.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hero{display:flex;gap:14px;align-items:center;margin:6px 0 12px}
.hero h1{font-size:24px;line-height:1.15}
.actions{display:flex;gap:8px;margin-bottom:6px;overflow-x:auto;scrollbar-width:none}
.btn{background:var(--acc);color:#fff;border-radius:22px;padding:9px 16px;font-weight:700;font-size:14px;white-space:nowrap;display:inline-block}
.btn.ghost{background:var(--card2)}
.btn.full{width:100%;padding:12px;text-align:center}
.tabs{position:sticky;top:60px;z-index:5;background:rgba(18,18,18,.96);backdrop-filter:blur(12px);display:flex;gap:4px;overflow-x:auto;margin:0 -16px;padding:4px 16px 0;border-bottom:1px solid var(--line);scrollbar-width:none}
.tabs a{padding:10px 10px 11px;font-size:14px;font-weight:600;color:var(--mut);white-space:nowrap;border-bottom:3px solid transparent}
.tabs a.on{color:#fff;border-color:var(--acc)}
.seg{display:flex;background:var(--card2);border-radius:10px;padding:3px;margin-bottom:10px}
.seg button{flex:1;padding:7px;border-radius:8px;font-size:13px;color:var(--mut);font-weight:600}
.seg button.on{background:#474747;color:#fff}
.chart svg{display:block;width:100%;touch-action:pan-y}
.tip{min-height:20px;font-size:12.5px;margin-bottom:4px;color:var(--mut)}
.tip b{color:#fff}
.axis{display:flex;justify-content:space-between;font-size:11px;color:var(--mut);margin-top:4px}
.bar{margin:11px 0}
.bar .l{display:flex;justify-content:space-between;gap:8px;font-size:14px}
.bar .tr{height:7px;border-radius:4px;background:var(--card2);margin-top:5px;overflow:hidden}
.bar .fl{display:block;height:100%;border-radius:4px;background:var(--c,var(--grn))}
.ev{display:flex;gap:12px;align-items:center;background:var(--card);border-radius:16px;padding:12px;margin-bottom:8px}
em{color:var(--blue);font-style:normal;font-weight:600}
.day{font-size:11px;color:var(--mut);text-align:center;margin:16px 0 8px;text-transform:uppercase;letter-spacing:.08em}
.list .it{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.list .it:last-child{border:0}
.cover{width:48px;height:48px;border-radius:8px;flex:none;object-fit:cover;background:var(--card2)}
.rank{width:22px;text-align:center;font-weight:800;color:var(--mut);flex:none}
.tag{font-size:11px;padding:2px 8px;border-radius:10px;background:var(--card2);color:#ccc;white-space:nowrap}
.play{width:38px;height:38px;border-radius:50%;background:var(--dz);color:#fff;flex:none;font-size:14px;display:grid;place-items:center}
.play.on{background:#fff;color:#111}
.ins{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.ins div{background:var(--card2);border-radius:12px;padding:10px;min-width:0}
.ins b{display:block;font-size:16px;margin-top:2px}
#map svg{width:100%;display:block}
#map path{stroke:#121212;stroke-width:.4;cursor:pointer}
#map path.sel{stroke:#fff;stroke-width:1.2}
.legend{display:flex;align-items:center;gap:8px;font-size:11px;color:var(--mut);margin-top:6px}
.legend i{flex:1;height:6px;border-radius:3px}
input[type=search]{width:100%;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:13px 14px;color:var(--txt);font:inherit;margin:14px 0 6px;-webkit-appearance:none}
select{background:var(--card2);border-radius:12px;padding:11px;width:100%;font-weight:600;appearance:none}
.vs{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center}
.cmp{margin:12px 0}
.cmp .h{display:flex;justify-content:space-between;gap:6px;font-size:13px;margin-bottom:4px}
.cmp .t{display:flex;height:8px;border-radius:4px;overflow:hidden;background:var(--card2)}
.hscroll{display:flex;gap:10px;overflow-x:auto;scrollbar-width:none;padding-bottom:4px}
.hscroll::-webkit-scrollbar{display:none}
.mini{flex:none;width:118px;text-align:center}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;justify-content:center;background:rgba(18,18,18,.96);backdrop-filter:blur(12px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);z-index:7}
nav div{display:flex;width:100%;max-width:560px}
nav a{flex:1;padding:9px 0 8px;font-size:11px;color:var(--mut);display:flex;flex-direction:column;align-items:center;gap:1px}
nav a span{font-size:21px;line-height:1.2}
nav a.on{color:#fff}
.sw{position:relative;width:48px;height:29px;flex:none}
.sw input{opacity:0;width:0;height:0}
.sw i{position:absolute;inset:0;background:#444;border-radius:15px;transition:.2s}
.sw i:before{content:"";position:absolute;width:23px;height:23px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.2s}
.sw input:checked+i{background:var(--grn)}
.sw input:checked+i:before{transform:translateX(19px)}
.toast{position:fixed;left:50%;top:10px;transform:translate(-50%,-150%);width:calc(100% - 24px);max-width:500px;background:rgba(242,242,242,.97);color:#111;border-radius:18px;padding:12px 14px;z-index:20;transition:.35s;box-shadow:0 8px 30px #0009}
.toast.show{transform:translate(-50%,0)}
.toast small{color:#666;font-size:11px}
.toast em{color:#0a64c8}
.modal{position:fixed;inset:0;background:#000d;display:none;align-items:center;justify-content:center;flex-direction:column;gap:14px;z-index:15;padding:16px}
.modal.show{display:flex}
.modal canvas{width:min(290px,72vw);border-radius:18px}
.back{font-size:15px;color:var(--mut);padding:6px 0}
.empty{color:var(--mut);text-align:center;padding:30px 10px}
.load{color:var(--mut);text-align:center;padding:50px 10px}
.load:before{content:"";display:block;width:28px;height:28px;margin:0 auto 12px;border:3px solid #333;border-top-color:var(--acc);border-radius:50%;animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.note{font-size:12px;color:var(--mut);background:var(--card);border-radius:12px;padding:10px 12px;margin:10px 0}
</style>
</head>
<body>
<div class="demo">Démo non officielle · données Deezer réelles + estimations simulées</div>
<header>
  <a class="ic" href="#profil" aria-label="Alertes et compte">👤</a>
  <a class="logo" href="#accueil"><i></i>Wavestats</a>
  <a class="ic" href="#recherche" aria-label="Rechercher">🔍</a>
</header>
<main id="app"></main>
<nav><div>
  <a data-t="accueil" href="#accueil"><span>🏠</span>Accueil</a>
  <a data-t="activite" href="#activite"><span>💿</span>Sorties</a>
  <a data-t="comparer" href="#comparer"><span>⚖️</span>Comparer</a>
  <a data-t="recherche" href="#recherche"><span>🔍</span>Recherche</a>
  <a data-t="profil" href="#profil"><span>🔔</span>Alertes</a>
</div></nav>
<div class="toast" id="toast"></div>
<div class="modal" id="modal" onclick="if(event.target===this)this.classList.remove('show')">
  <canvas id="cv" width="1080" height="1920"></canvas>
  <div style="display:flex;gap:10px">
    <button class="btn" id="shareBtn">Partager / Enregistrer</button>
    <button class="btn ghost" onclick="modal.classList.remove('show')">Fermer</button>
  </div>
</div>
<script>
// ---------- Deezer (API publique gratuite, appelée en JSONP) ----------
let jp = 0;
function dz(path){
  return new Promise((res, rej) => {
    const cb = 'dzcb' + (++jp), s = document.createElement('script');
    const done = () => { clearTimeout(t); delete window[cb]; s.remove(); };
    const t = setTimeout(() => { done(); rej(new Error('délai dépassé')); }, 10000);
    window[cb] = d => { done(); d && d.error ? rej(new Error(d.error.message)) : res(d); };
    s.onerror = () => { done(); rej(new Error('réseau')); };
    s.src = `https://api.deezer.com/${path}${path.includes('?') ? '&' : '?'}output=jsonp&callback=${cb}`;
    document.head.appendChild(s);
  });
}

// ---------- Estimations simulées (Deezer ne donne pas les pays ni les autres plateformes) ----------
let seed = 1; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
const pick = arr => arr[Math.floor(rnd() * arr.length)];
const PLAT = [
  {id:'spotify',n:'Spotify',l:'S',c:'#1ed760',f:1,m:[['Auditeurs mensuels','listeners'],['Followers','followers'],['Popularité','popularity'],['Streams (28 j)','streams'],['Playlists actuelles','playlists'],['Portée des playlists','reach']]},
  {id:'apple',n:'Apple Music',l:'♫',c:'#fa2d48',f:.45,m:[['Streams (28 j)','streams'],['Playlists éditoriales','playlists'],['Classements actifs','charts'],['Meilleure position','best']]},
  {id:'youtube',n:'YouTube',l:'▶',c:'#ff3b30',f:.8,m:[['Abonnés','followers'],['Vues (28 j)','streams'],['Vues totales','views'],['Vidéos','videos']]},
  {id:'tiktok',n:'TikTok',l:'♪',c:'#20d5c4',f:1.4,m:[['Vidéos créées avec le son','videos'],['Vues des vidéos','views'],['Followers','followers'],['Likes','likes']]},
  {id:'shazam',n:'Shazam',l:'◎',c:'#4aa3ff',f:.3,m:[['Shazams (28 j)','shazams'],['Shazams totaux','views'],['Classements actifs','charts'],['Meilleure position','best']]},
  {id:'amazon',n:'Amazon Music',l:'a',c:'#ff9900',f:.25,m:[['Followers','followers'],['Streams (28 j)','streams'],['Playlists','playlists'],['Classements actifs','charts']]},
  {id:'soundcloud',n:'SoundCloud',l:'☁',c:'#ff5500',f:.3,m:[['Followers','followers'],['Écoutes (28 j)','streams'],['Likes','likes'],['Reposts','playlists']]},
  {id:'beatport',n:'Beatport',l:'B',c:'#a8e00f',f:.05,m:[['Classements actifs','charts'],['Meilleure position','best'],['Titres classés','tracks'],['Ventes estimées','likes']]},
  {id:'tidal',n:'Tidal',l:'T',c:'#d8d8d8',f:.1,m:[['Streams (28 j)','streams'],['Playlists','playlists'],['Followers','followers'],['Portée des playlists','reach']]},
  {id:'audiomack',n:'Audiomack',l:'M',c:'#ffa200',f:.15,m:[['Followers','followers'],['Écoutes (28 j)','streams'],['Playlists','playlists'],['Likes','likes']]},
];
const DZ = {n:'Deezer', l:'D', c:'#a238ff'};
const SOCIAL = [{id:'instagram',n:'Instagram',l:'◉',c:'#e1306c'},{id:'tiktok',n:'TikTok',l:'♪',c:'#20d5c4'},{id:'youtube',n:'YouTube',l:'▶',c:'#ff3b30'},{id:'x',n:'X (Twitter)',l:'X',c:'#e8e8e8'},{id:'facebook',n:'Facebook',l:'f',c:'#1877f2'}];
const COUNTRIES = [['France',250,'🇫🇷'],['États-Unis',840,'🇺🇸'],['Allemagne',276,'🇩🇪'],['Royaume-Uni',826,'🇬🇧'],['Brésil',76,'🇧🇷'],['Espagne',724,'🇪🇸'],['Italie',380,'🇮🇹'],['Mexique',484,'🇲🇽'],['Canada',124,'🇨🇦'],['Pays-Bas',528,'🇳🇱'],['Belgique',56,'🇧🇪'],['Suisse',756,'🇨🇭'],['Maroc',504,'🇲🇦'],['Algérie',12,'🇩🇿'],['Tunisie',788,'🇹🇳'],['Sénégal',686,'🇸🇳'],["Côte d'Ivoire",384,'🇨🇮'],['Nigeria',566,'🇳🇬'],['Japon',392,'🇯🇵'],['Australie',36,'🇦🇺'],['Argentine',32,'🇦🇷'],['Colombie',170,'🇨🇴'],['Pologne',616,'🇵🇱'],['Suède',752,'🇸🇪'],['Turquie',792,'🇹🇷'],['Portugal',620,'🇵🇹'],['Inde',356,'🇮🇳'],['Afrique du Sud',710,'🇿🇦']];
const CITIES = [['Paris',250],['Lyon',250],['Marseille',250],['Toulouse',250],['Londres',826],['Manchester',826],['Berlin',276],['Hambourg',276],['New York',840],['Los Angeles',840],['Chicago',840],['São Paulo',76],['Rio de Janeiro',76],['Madrid',724],['Barcelone',724],['Milan',380],['Rome',380],['Mexico',484],['Montréal',124],['Toronto',124],['Amsterdam',528],['Bruxelles',56],['Genève',756],['Casablanca',504],['Alger',12],['Tunis',788],['Dakar',686],['Abidjan',384],['Lagos',566],['Tokyo',392],['Sydney',36],['Buenos Aires',32],['Bogotá',170],['Varsovie',616],['Stockholm',752],['Istanbul',792],['Lisbonne',620],['Mumbai',356],['Johannesburg',710]];
const country = iso => COUNTRIES.find(c => c[1] === iso);
const PL_NAMES = {Éditoriale:['Fresh Finds','Hits du Moment','New Music Friday','Électro Chill','Rap FR Nouveautés','Afro Hits','Dance Rising','Pop Up','Techno Bunker','Club Bangers','Summer Vibes','Ultimate Party'],Algorithmique:['Radar des Sorties','Discover Weekly','Daily Mix 2','Flow','Mix du jour','Station radio'],Utilisateur:['Soirée entre potes','Running 180 BPM','Sons du moment ✨','Apéro','Workout Motivation','Road Trip','Chill du dimanche']};
const STATIONS = ['Onde 101','Radio Nova Sud','Club FM','Urban Wave','Électro 24','Hit Radio Lyon','Soleil FM','Night Session Radio'];
const DJS = ['DJ Marlo','Sasha Kern','Nils Ombre','Kira Vale','Tom Rives','Aya Moon','Duo Polaris','Félix Arno'];
const EVENTS_N = ['Festival Horizon','Club Orbite','Warehouse Session','Plage Électro','Nuit Blanche Open Air','Rooftop Sunset'];

const trendOf = (base, g, len = 180) => Array.from({length:len}, (_, d) => Math.max(1, base * (1 + g * (d - len + 1) / len + Math.sin(d / 11 + rnd()) * .025 + (rnd() - .5) * .025)));
const deltaOf = t => (t[t.length - 1] - t[t.length - 29]) / t[t.length - 29] * 100;
const daysAgoDate = d => { const x = new Date(); x.setDate(x.getDate() - d); return x; };

function build(ar, top, albums, related){
  const a = {id:ar.id, name:ar.name, pic:ar.picture_big || ar.picture_medium, fans:ar.nb_fan || 0, nbAlbum:ar.nb_album || 0, link:ar.link, hue:ar.id % 360,
    top:top.map(t => ({id:t.id, t:t.title_short || t.title, rank:t.rank || 0, dur:t.duration, prev:t.preview, cover:t.album && t.album.cover_medium, album:t.album && t.album.title, link:t.link})),
    albums:albums.map(x => ({t:x.title, cover:x.cover_medium, date:x.release_date || '', type:x.record_type, fans:x.fans || 0, link:x.link})).sort((x, y) => y.date.localeCompare(x.date)),
    related:related.map(r => ({id:r.id, name:r.name, pic:r.picture_medium, fans:r.nb_fan || 0}))};
  // Estimations : toujours les mêmes pour un artiste donné
  seed = ar.id % 2147483646 + 1; rnd();
  const scale = Math.max(a.fans, 3000) * 2.5, g = rnd() * .8 - .1, home = pick([250,250,250,840,826,276,724,56,504,124]);
  a.home = home; a.p = {};
  PLAT.forEach(pl => {
    const s = scale * pl.f * (.6 + rnd() * .8);
    a.p[pl.id] = {listeners:s*4, followers:s*.7, popularity:Math.round(35+rnd()*60), streams:s*11, playlists:Math.round(5+rnd()*400*pl.f), reach:s*25,
      charts:Math.round(rnd()*40*pl.f+1), shazams:s*.9, videos:Math.round(s*.08), views:s*40, likes:s*3, best:1+Math.floor(rnd()*80), tracks:Math.round(1+rnd()*12)};
    a.p[pl.id].trend = trendOf(a.p[pl.id][pl.m[0][1]], g + (rnd() - .5) * .3);
    a.p[pl.id].delta = deltaOf(a.p[pl.id].trend);
  });
  const L = a.p.spotify.listeners, w = COUNTRIES.map(c => [c, (c[1] === home ? 6 : 0) + rnd() ** 3 * 2]), sum = w.reduce((s, x) => s + x[1], 0);
  a.countries = w.map(([c, v]) => ({n:c[0], iso:c[1], flag:c[2], v:L * v / sum, d:(rnd() - .3) * 25})).sort((x, y) => y.v - x.v);
  a.cities = CITIES.map(([n, iso]) => { const c = a.countries.find(x => x.iso === iso); return {n, iso, flag:c.flag, v:c.v * (.15 + rnd() * .5), d:(rnd() - .3) * 25}; }).sort((x, y) => y.v - x.v);
  const nt = Math.max(1, Math.min(5, a.top.length));
  a.playlists = Array.from({length:18}, () => { const type = pick(['Éditoriale','Éditoriale','Algorithmique','Utilisateur','Utilisateur']);
    return {name:pick(PL_NAMES[type]), type, pl:pick(['spotify','spotify','apple','amazon','youtube','tidal','soundcloud']), fol:10 ** (2.5 + rnd() * 4), pos:1 + Math.floor(rnd() * 80), ago:Math.floor(rnd() * 60), track:Math.floor(rnd() * nt)}; }).sort((x, y) => y.fol - x.fol);
  a.charts = Array.from({length:10}, () => { const c = rnd() < .5 ? country(home)[0] : pick(a.countries.slice(0, 8)).n;
    const [pl, name] = pick([['spotify',`Top 200 ${c}`],['spotify',`Viral 50 ${c}`],['apple',`Top 100 ${c}`],['shazam',`Shazam Top 200 ${c}`],['youtube',`Top Clips ${c}`],['beatport','Top 100 Beatport'],['amazon',`Meilleures ventes ${c}`]]);
    const pos = 1 + Math.floor(rnd() * 150);
    return {name, pl, pos, peak:Math.max(1, pos - Math.floor(rnd() * 40)), weeks:1 + Math.floor(rnd() * 20), move:Math.round((rnd() - .4) * 30), track:Math.floor(rnd() * nt)}; }).sort((x, y) => x.pos - y.pos);
  a.radio = STATIONS.map(n => ({n, flag:pick(a.countries.slice(0, 5)).flag, v:Math.round(rnd() * 200 * (scale / 1e5) + 3)})).sort((x, y) => y.v - x.v).slice(0, 6);
  a.djs = Array.from({length:6}, (_, k) => ({dj:pick(DJS), ev:pick(EVENTS_N), ago:k * 4 + Math.floor(rnd() * 4), track:Math.floor(rnd() * nt)}));
  a.socials = SOCIAL.map(s => { const t = trendOf(scale * (.3 + rnd()), g + (rnd() - .5) * .2); return {...s, fol:t[179], eng:(1 + rnd() * 7).toFixed(1), trend:t, d:deltaOf(t)}; });
  return a;
}
const tn = (a, i) => (a.top[i] || {t:'—'}).t;

// ---------- Petits outils d'affichage ----------
function fmt(n){return new Intl.NumberFormat('fr-FR', {notation:'compact', maximumFractionDigits:1}).format(Math.round(n))}
const full = n => Math.round(n).toLocaleString('fr-FR');
function dateFr(d, opt = {day:'numeric', month:'long', year:'numeric'}){return (typeof d === 'string' ? new Date(d + 'T12:00') : d).toLocaleDateString('fr-FR', opt)}
const ago = h => h < 1 ? "à l'instant" : h < 24 ? `il y a ${h} h` : `il y a ${Math.floor(h / 24)} j`;

const player = new Audio(); let playing = null;
function playPrev(btn, url){
  if (playing === url) { player.pause(); playing = null; btn.classList.remove('on'); btn.textContent = '▶'; return; }
  document.querySelectorAll('.play.on').forEach(b => { b.classList.remove('on'); b.textContent = '▶'; });
  player.src = url; player.play().catch(() => {}); playing = url; btn.classList.add('on'); btn.textContent = '❚❚';
  player.onended = () => { playing = null; btn.classList.remove('on'); btn.textContent = '▶'; };
}
const playBtn = t => t.prev ? `<button class="play" aria-label="Écouter un extrait" onclick="event.preventDefault();playPrev(this,'${t.prev}')">▶</button>` : '';

// Graphique en courbe, lisible au doigt
let pendingCharts = [];
function chart(series, h = 150){
  const id = 'c' + pendingCharts.length + Date.now(), w = 340, all = series.flatMap(s => s.data), min = Math.min(...all), max = Math.max(...all), n = series[0].data.length;
  const x = i => i / (n - 1) * w, y = v => h - 8 - (v - min) / (max - min || 1) * (h - 26);
  pendingCharts.push({id, series, x, n});
  const paths = series.map(s => { const d = s.data.map((v, i) => (i ? 'L' : 'M') + x(i).toFixed(1) + ' ' + y(v).toFixed(1)).join('');
    return (series.length === 1 ? `<path d="${d}L${w} ${h}L0 ${h}Z" fill="${s.color}" opacity=".14"/>` : '') + `<path d="${d}" fill="none" stroke="${s.color}" stroke-width="2.5" stroke-linejoin="round"/>`; }).join('');
  const grid = [0, .5, 1].map(f => { const v = min + (max - min) * f; return `<line x1="0" x2="${w}" y1="${y(v)}" y2="${y(v)}" stroke="#ffffff14"/><text x="${w - 2}" y="${y(v) - 4}" fill="#8a8a8a" font-size="10" text-anchor="end">${fmt(v)}</text>`; }).join('');
  return `<div class="chart" id="${id}"><div class="tip">Glissez le doigt sur la courbe pour voir le détail</div><svg viewBox="0 0 ${w} ${h}">${grid}${paths}<line class="cur" y1="0" y2="${h}" stroke="#fff8" visibility="hidden"/></svg><div class="axis"><span>${dateFr(daysAgoDate(n - 1), {day:'numeric', month:'short'})}</span><span>Aujourd'hui</span></div></div>`;
}
function bindCharts(){
  pendingCharts.forEach(c => {
    const el = document.getElementById(c.id); if (!el) return;
    const svg = el.querySelector('svg'), line = el.querySelector('.cur'), tip = el.querySelector('.tip');
    const move = e => { const r = svg.getBoundingClientRect(), i = Math.max(0, Math.min(c.n - 1, Math.round((e.clientX - r.left) / r.width * (c.n - 1))));
      line.setAttribute('x1', c.x(i)); line.setAttribute('x2', c.x(i)); line.setAttribute('visibility', 'visible');
      tip.innerHTML = `<b>${dateFr(daysAgoDate(c.n - 1 - i), {weekday:'short', day:'numeric', month:'short'})}</b> · ` + c.series.map(s => `<span style="color:${s.color}">${s.name ? esc(s.name) + ' : ' : ''}${full(s.data[i])}</span>`).join(' · '); };
    svg.addEventListener('pointermove', move); svg.addEventListener('pointerdown', move);
  });
  pendingCharts = [];
}

let mapLib;
function loadMap(){
  return mapLib ||= Promise.all([
    import('https://cdn.jsdelivr.net/npm/d3-geo@3.1.1/+esm'),
    import('https://cdn.jsdelivr.net/npm/topojson-client@3.1.0/+esm'),
    fetch('https://cdn.jsdelivr.net/npm/world-atlas@2.0.2/countries-110m.json').then(r => r.json()),
  ]).then(([geo, topo, world]) => ({geo, feats:topo.feature(world, world.objects.countries).features.filter(f => f.id !== '010')}))
    .catch(e => { mapLib = null; throw e; });
}
async function drawMap(a){
  const box = document.getElementById('map'); if (!box) return;

    box.innerHTML = `<svg viewBox="0 0 340 175">${feats.map(f => { const c = a.countries.find(x => x.iso === +f.id), v = c ? c.v : 0;
      return `<path d="${path(f)}" data-iso="${+f.id}" fill="${v ? color : '#3a3a3a'}" fill-opacity="${v ? (.18 + .82 * Math.sqrt(v / max)).toFixed(2) : 1}"${+f.id === state.selIso ? ' class="sel"' : ''}/>`; }).join('')}</svg>
      <div class="legend">Peu<i style="background:linear-gradient(90deg,${color}33,${color})"></i>Beaucoup d'auditeurs</div>`;

    ev.forEach(e => { const m = dateFr(e.x.date, {month:'long', year:'numeric'}); if (m !== last) { out += `<div class="day">${m}</div>`; last = m; } out += relHtml(e); });
    const loaded = followed.every(id => ART[id]);
    return `<h2>Sorties de mes artistes ${REAL}</h2><div class="pills">${F.map(([k, n]) => `<button class="pill txt${k === state.feed ? ' on' : ''}" onclick="state.feed='${k}';render(1)">${n}</button>`).join('')}</div>${out || (loaded ? '<p class="empty">Rien pour le moment. Suivez des artistes pour voir leurs sorties.</p>' : loading())}`;
  },
  comparer(){
    const ids = followed.filter(id => ART[id]);
    if (ids.length < 2) return `<h2>Comparer deux artistes</h2>${followed.length < 2 ? '<p class="empty">Suivez au moins deux artistes pour les comparer.</p>' : loading()}`;
    if (!ids.includes(state.cmpA)) state.cmpA = ids[0];
    if (!ids.includes(state.cmpB) || state.cmpB === state.cmpA) state.cmpB = ids.find(i => i !== state.cmpA);
    const A = ART[state.cmpA], B = ART[state.cmpB], pl = PLAT.find(p => p.id === state.cmpPlat), ca = '#ff2d55', cb = '#4aa3ff';
    const sel = (k, v) => `<select onchange="state.${k}=+this.value;render(1)">${ids.map(i => `<option value="${i}"${i === v ? ' selected' : ''}>${esc(ART[i].name)}</option>`).join('')}</select>`;
    const row = (n, x, y, f = full) => `<div class="cmp"><div class="h"><b style="color:${ca}">${f(x)}</b><span class="sub" style="text-align:center">${n}</span><b style="color:${cb}">${f(y)}</b></div><div class="t"><span style="width:${(x / (x + y || 1)) * 100}%;background:${ca}"></span><span style="flex:1;background:${cb}"></span></div></div>`;
    return `<h2>Comparer deux artistes</h2><div class="vs">${sel('cmpA', state.cmpA)}<b class="sub">VS</b>${sel('cmpB', state.cmpB)}</div>
      <p class="sub" style="margin-top:8px">Seuls vos artistes suivis apparaissent ici.</p>
      <h2>Deezer ${REAL}</h2><div class="card">${row('Fans Deezer', A.fans, B.fans)}${row('Albums & singles', A.nbAlbum, B.nbAlbum)}${row('Popularité du titre n°1', A.top[0] ? pop(A.top[0].rank) : 0, B.top[0] ? pop(B.top[0].rank) : 0, v => v + '/100')}</div>
      <h2>Autres plateformes ${SIM}</h2>
      <div class="pills">${PLAT.map(p => `<button class="pill${p.id === state.cmpPlat ? ' on' : ''}" onclick="state.cmpPlat='${p.id}';render(1)">${dot(p)}${p.n}</button>`).join('')}</div>
      <div class="card">${pl.m.map(([n, k]) => row(n, k === 'best' ? 1 / A.p[pl.id][k] : A.p[pl.id][k], k === 'best' ? 1 / B.p[pl.id][k] : B.p[pl.id][k], k === 'best' ? v => 'n°' + Math.round(1 / v) : v => val(k, v))).join('')}</div>
      <div class="card"><p class="sub" style="margin-bottom:6px">Progression · ${pl.m[0][0]} · base 100 il y a 3 mois</p>${chart([A, B].map((x, k) => { const t = x.p[pl.id].trend.slice(-90); return {data:t.map(v => v / t[0] * 100), color:k ? cb : ca, name:x.name}; }))}</div>
      <h2>Pays n°1 à 5 ${SIM}</h2><div class="card" style="display:grid;grid-template-columns:1fr 1fr;gap:12px;font-size:14px">${[A, B].map((x, k) => `<div><b style="color:${k ? cb : ca}">${esc(x.name)}</b>${x.countries.slice(0, 5).map(c => `<div style="padding:3px 0">${c.flag} ${c.n} <span class="sub">${fmt(c.v)}</span></div>`).join('')}</div>`).join('')}</div>`;
  },
  recherche(){
    return `<input type="search" id="q" placeholder="Nom d'un artiste (ex. Solomun)…" oninput="onSearch()" value="${esc(state.q)}" autocomplete="off"><div id="res"></div>`;
  },
  profil(){
    const items = [['album','Nouveaux albums','Dès qu\'un artiste suivi sort un album'],['single','Nouveaux singles','Chaque nouveau single'],['ep','Nouveaux EP','Chaque nouvel EP'],['weekly','Résumé de la semaine','Chaque lundi, les chiffres clés']];
    return `<h2>Notifications</h2>${items.map(([k, n, d]) => `<label class="row"><div class="grow"><b>${n}</b><div class="sub">${d}</div></div><span class="sw"><input type="checkbox" ${prefs[k] ? 'checked' : ''} onchange="prefs.${k}=this.checked;store.set('prefs',prefs)"><i></i></span></label>`).join('')}
      <button class="btn full" style="margin-top:8px" onclick="testNotif()">🔔 Tester une notification</button>
      <h2>Mon compte</h2><div class="card"><b>Formule gratuite</b><div class="sub" style="margin:4px 0 12px">${followed.length} artiste(s) suivi(s)</div><button class="btn ghost" onclick="toast('Wavestats Pro','Le paiement n\\'est pas disponible dans cette démo.')">Découvrir Wavestats Pro</button></div>
      <h2>D'où viennent les chiffres ?</h2><div class="card sub" style="line-height:1.6">${REAL} : nom, photo, fans Deezer, titres populaires, extraits, discographie et artistes similaires. Ils viennent de Deezer en direct.<br><br>${SIM} : pays, villes, autres plateformes, playlists, classements, radio, DJ et réseaux sociaux. Ce sont des exemples, car ces chiffres ne sont pas publics. Il faudrait l'API payante de Songstats pour les avoir.<br><br>Démo non officielle, sans lien avec Songstats ni Deezer.</div>`;
  },
};

function artistView(id, t){
  const a = ART[id];
  if (!a) {
    loadArtist(id).then(() => { if (location.hash.startsWith('#artiste/' + id)) render(1); }, () => { if (location.hash.startsWith('#artiste/' + id)) document.getElementById('app').innerHTML = netErr; });
    return `<button class="back" onclick="goBack()">‹ Retour</button>${loading()}`;
  }
  if (!tab[t]) t = 'apercu';
  const isF = followed.includes(a.id);
  return `<button class="back" onclick="goBack()">‹ Retour</button>
    <div class="hero">${av(a, 1)}<div class="grow"><h1>${esc(a.name)}</h1><div class="sub">${full(a.fans)} fans Deezer · ${a.nbAlbum} sorties</div><a class="sub" href="${a.link}" target="_blank" rel="noopener" style="color:#c48bff">Ouvrir dans Deezer ↗</a></div></div>
    <div class="actions"><button class="btn${isF ? ' ghost' : ''}" onclick="toggleFollow(${a.id})">${isF ? '✓ Suivi' : '+ Suivre'}</button><button class="btn ghost" onclick="openShare(${a.id})">📤 Story</button><button class="btn ghost" onclick="exportCSV(${a.id})">⬇️ Exporter</button><a class="btn ghost" href="#comparer" onclick="state.cmpA=${a.id}">⚖️ Comparer</a></div>
    <div class="tabs">${TABS.map(([k, n]) => `<a href="#artiste/${a.id}/${k}" class="${k === t ? 'on' : ''}">${n}</a>`).join('')}</div>
    ${tab[t](a)}`;
}
function trackView(aid, k){
  const a = ART[aid];
  if (!a) { loadArtist(aid).then(() => render(1), () => document.getElementById('app').innerHTML = netErr); return loading(); }
  const t = a.top[k]; if (!t) return views.accueil();
  seed = t.id % 2147483646 + 1; rnd();
  const s = Math.max(t.rank, 1000) * 3, tr = trendOf(s / 30, rnd() * .6 - .1);
  const pls = a.playlists.filter(x => x.track === k), chs = a.charts.filter(x => x.track === k);
  return `<button class="back" onclick="goBack()">‹ Retour</button>
    <div class="hero"><img class="cover" src="${t.cover || ''}" alt="" style="width:96px;height:96px"><div class="grow"><h1>${esc(t.t)}</h1><a class="sub" href="#artiste/${a.id}">${esc(a.name)} ›</a><div class="sub">Album : ${esc(t.album || '—')} · ${mmss(t.dur)}</div></div></div>
    <div class="actions">${t.prev ? `<button class="btn" onclick="playPrev(this,'${t.prev}');this.textContent=playing?'❚❚ Pause':'▶ Écouter l\\'extrait'">▶ Écouter l'extrait</button>` : ''}<a class="btn ghost" href="${t.link}" target="_blank" rel="noopener">Ouvrir dans Deezer ↗</a></div>
    <h2>Deezer ${REAL}</h2><div class="tiles" style="--c:#c48bff"><div class="tile"><div class="n">Popularité Deezer</div><b>${pop(t.rank)}/100</b></div><div class="tile"><div class="n">Place chez l'artiste</div><b>n°${k + 1}</b></div></div>
    <h2>Estimations ${SIM}</h2><div class="tiles"><div class="tile"><div class="n">Streams totaux</div><b>${fmt(s * 120)}</b></div><div class="tile" style="--c:#4aa3ff"><div class="n">Shazams</div><b>${fmt(s * 4)}</b></div><div class="tile" style="--c:#20d5c4"><div class="n">Vidéos TikTok</div><b>${fmt(s / 2)}</b></div><div class="tile"><div class="n">Playlists</div><b>${Math.round(s / 3000) + pls.length}</b></div></div>
    <h2>Streams par jour (3 mois) ${SIM}</h2><div class="card">${chart([{data:tr.slice(-90), color:'#1ed760'}])}</div>
    <h2>Dans les playlists ${SIM}</h2><div class="card list">${pls.map(x => `<div class="it">${dot(PLAT.find(p => p.id === x.pl))}<div class="grow"><b>${x.name}</b><div class="sub">position ${x.pos} · ${x.type}</div></div><b>${fmt(x.fol)}</b></div>`).join('') || '<p class="empty">Pas de playlist suivie.</p>'}</div>
    <h2>Dans les classements ${SIM}</h2><div class="card list">${chs.map(x => `<div class="it">${dot(PLAT.find(p => p.id === x.pl))}<div class="grow"><b>${x.name}</b><div class="sub">meilleur : n°${x.peak} · ${x.weeks} sem.</div></div><b>n°${x.pos}</b></div>`).join('') || '<p class="empty">Pas de classement actif.</p>'}</div>`;
}

// ---------- Navigation (le bouton retour du téléphone fonctionne) ----------
let navDepth = 0;
function goBack(){ navDepth > 0 ? history.back() : (location.hash = 'accueil'); }
function render(keepScroll){
  const [v, x, y] = (location.hash.slice(1) || 'accueil').split('/');
  const app = document.getElementById('app'), sy = scrollY;
  app.innerHTML = v === 'artiste' ? artistView(+x, y || 'apercu') : v === 'titre' ? trackView(+x, +y) : (views[v] || views.accueil)();
  document.querySelectorAll('nav a').forEach(b => b.classList.toggle('on', b.dataset.t === v));
  scrollTo({top:keepScroll ? sy : 0, behavior:'instant'});
  bindCharts();
  if (v === 'recherche') { const q = document.getElementById('q'); q.focus(); doSearch(); }
  if (v === 'artiste' && y === 'audience' && ART[+x]) drawMap(ART[+x]).then(() => state.selIso && showCountry(ART[+x]));
}
addEventListener('hashchange', () => { navDepth++; state.selIso = null; render(0); });

let sTimer;
function onSearch(){ state.q = document.getElementById('q').value; clearTimeout(sTimer); sTimer = setTimeout(doSearch, 350); }
async function doSearch(){
  const res = document.getElementById('res'), q = state.q.trim(); if (!res) return;
  if (!q) { res.innerHTML = `<h2>Mes artistes</h2>` + followed.map(id => meta[id] ? `<div class="row"><a href="#artiste/${id}" style="display:flex;align-items:center;gap:12px;flex:1;min-width:0">${av(meta[id])}<div class="grow"><b class="ell" style="display:block">${esc(meta[id].name)}</b><div class="sub">${full(meta[id].fans)} fans Deezer</div></div></a>${followBtn(id)}</div>` : '').join('') + '<p class="sub" style="text-align:center;margin-top:12px">Tapez le nom de n\'importe quel artiste : les résultats viennent de Deezer.</p>'; return; }
  res.innerHTML = loading('Recherche…');
  try {
    const [ar, tr] = await Promise.all([dz(`search/artist?q=${encodeURIComponent(q)}&limit=25`), dz(`search/track?q=${encodeURIComponent(q)}&limit=6`)]);
    if (state.q.trim() !== q) return;
    const ql = q.toLowerCase(), score = n => n.toLowerCase() === ql ? 2 : n.toLowerCase().startsWith(ql) ? 1 : 0;
    const arts = (ar.data || []).sort((x, y) => score(y.name) - score(x.name) || y.nb_fan - x.nb_fan).slice(0, 15);
    arts.forEach(x => { if (!meta[x.id]) meta[x.id] = {name:x.name, pic:x.picture_big || x.picture_medium, fans:x.nb_fan}; });
    res.innerHTML = `<h2>Artistes ${REAL}</h2>` + (arts.map(x => `<div class="row"><a href="#artiste/${x.id}" style="display:flex;align-items:center;gap:12px;flex:1;min-width:0">${av({pic:x.picture_medium})}<div class="grow"><b class="ell" style="display:block">${esc(x.name)}</b><div class="sub">${full(x.nb_fan)} fans Deezer · ${x.nb_album} sorties</div></div></a>${followBtn(x.id)}</div>`).join('') || '<p class="empty">Aucun artiste trouvé. Vérifiez l\'orthographe.</p>')
      + ((tr.data || []).length ? `<h2>Titres</h2><div class="card list">${tr.data.map(t => `<a class="it" href="#artiste/${t.artist.id}/titres"><img class="cover" src="${t.album.cover_medium}" alt="" loading="lazy"><div class="grow"><b class="ell" style="display:block">${esc(t.title_short || t.title)}</b><div class="sub">${esc(t.artist.name)}</div></div>${playBtn({prev:t.preview})}</a>`).join('')}</div>` : '');
  } catch { if (state.q.trim() === q) res.innerHTML = netErr.replace('render(1)', 'doSearch()'); }
}
function toggleFollow(id, inList){
  id = +id;
  followed = followed.includes(id) ? followed.filter(x => x !== id) : [...followed, id];
  store.set('followed', followed); store.set('meta', meta);
  const name = (ART[id] || meta[id] || {}).name || 'Artiste';
  toast(esc(name), followed.includes(id) ? 'Ajouté à vos artistes. Vous verrez ses nouvelles sorties.' : 'Retiré de vos artistes.');
  if (followed.includes(id)) loadArtist(id).catch(() => {});
  location.hash.startsWith('#recherche') ? doSearch() : render(1);
}
function toast(title, body){
  const t = document.getElementById('toast');
  t.innerHTML = `<small>WAVESTATS · maintenant</small><div><b>${title}</b></div><div style="font-size:14px">${body}</div>`;
  t.classList.add('show'); clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove('show'), 4000);
}
function testNotif(){
  const e = releases().find(e => prefs[e.x.type] !== false);
  e ? toast(esc(e.a.name) + ' · Nouvelle sortie', `<em>${esc(e.x.t)}</em> (${TYPE[e.x.type] || e.x.type}) est sorti le ${dateFr(e.x.date)}`) : toast('Wavestats', 'Suivez des artistes pour recevoir leurs alertes.');
}
function exportCSV(id){
  const a = ART[id], rows = [['Source', 'Rubrique', 'Statistique', 'Valeur']];
  rows.push(['Réel (Deezer)', 'Deezer', 'Fans', a.fans], ['Réel (Deezer)', 'Deezer', 'Albums & singles', a.nbAlbum]);
  a.top.forEach((t, k) => rows.push(['Réel (Deezer)', 'Titres populaires', `${k + 1}. ${t.t}`, pop(t.rank) + '/100']));
  a.albums.forEach(x => rows.push(['Réel (Deezer)', 'Sorties', `${x.t} (${TYPE[x.type] || x.type})`, x.date]));
  PLAT.forEach(pl => pl.m.forEach(([n, k]) => rows.push(['Estimation simulée', pl.n, n, Math.round(a.p[pl.id][k])])));
  a.countries.forEach(c => rows.push(['Estimation simulée', 'Audience par pays', c.n, Math.round(c.v)]));
  const csv = rows.map(r => r.map(x => `"${String(x).replace(/"/g, '""')}"`).join(';')).join('\n');
  const l = document.createElement('a'); l.href = URL.createObjectURL(new Blob(['﻿' + csv], {type:'text/csv'})); l.download = a.name.replace(/\W+/g, '-') + '-wavestats.csv'; l.click();
  toast('Export prêt', 'Le fichier tableur (CSV) est téléchargé. Il indique ce qui est réel et ce qui est estimé.');
}
function openShare(id){
  const a = ART[id], cv = document.getElementById('cv'), c = cv.getContext('2d'), g = c.createLinearGradient(0, 0, 1080, 1920);
  g.addColorStop(0, `hsl(${a.hue} 75% 45%)`); g.addColorStop(.55, `hsl(${(a.hue + 70) % 360} 70% 28%)`); g.addColorStop(1, '#111');
  c.fillStyle = g; c.fillRect(0, 0, 1080, 1920); c.fillStyle = '#fff'; c.textAlign = 'center';
  c.font = '800 64px -apple-system,sans-serif'; c.fillText('Wavestats', 540, 200);
  let fs = 118; do { c.font = `800 ${fs}px -apple-system,sans-serif`; fs -= 6; } while (c.measureText(a.name).width > 960 && fs > 50);
  c.fillText(a.name, 540, 640);
  const stats = [['Fans Deezer', full(a.fans)], ['Titre n°1', tn(a, 0)], ['Sorties', String(a.nbAlbum)]];
  stats.forEach(([n, v], k) => { c.fillStyle = '#ffffff22'; c.beginPath(); c.roundRect(140, 800 + k * 300, 800, 250, 40); c.fill(); c.fillStyle = '#fff';
    let f = 100; do { c.font = `800 ${f}px -apple-system,sans-serif`; f -= 6; } while (c.measureText(v).width > 720 && f > 40);
    c.fillText(v, 540, 925 + k * 300); c.font = '500 42px -apple-system,sans-serif'; c.fillStyle = '#ffffffcc'; c.fillText(n, 540, 995 + k * 300); });
  c.font = '500 34px -apple-system,sans-serif'; c.fillStyle = '#ffffff88'; c.fillText('Source : Deezer · démo Wavestats', 540, 1840);
  document.getElementById('modal').classList.add('show');
  document.getElementById('shareBtn').onclick = () => cv.toBlob(async b => {
    const f = new File([b], 'wavestats-story.png', {type:'image/png'});
    if (navigator.canShare?.({files:[f]})) { try { await navigator.share({files:[f]}); } catch {} }
    else { const l = document.createElement('a'); l.href = URL.createObjectURL(b); l.download = f.name; l.click(); }
  });
}

render(0);
// Charge les artistes suivis puis rafraîchit les pages qui en dépendent
followed.forEach(id => loadArtist(id).then(() => { if (/^#?(accueil|activite|comparer)?$/.test(location.hash)) render(1); }).catch(() => {}));
</script>
